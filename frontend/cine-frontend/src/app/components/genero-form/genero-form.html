<!-- src/app/components/genero-form/genero-form.html -->
<div class="contenedor">

  <a routerLink="/generos" class="btn-volver">← Volver a géneros</a>

  <div class="tarjeta-form">
    <h1>🎬 Nuevo Género</h1>

    <form [formGroup]="generoForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- Campo Nombre -->
      <div class="campo" [class.campo-error]="nombre_genero.invalid && nombre_genero.touched">
        <label for="nombre_genero">Nombre *</label>
        <input
          id="nombre_genero"
          type="text"
          formControlName="nombre_genero"
          placeholder="Ej: Acción, Drama, Comedia..."
        />
        <!-- Mensajes de validación -->
        @if (nombre_genero.touched && nombre_genero.errors?.['required']) {
          <span class="msg-error">El nombre es obligatorio.</span>
        }
        @if (nombre_genero.touched && nombre_genero.errors?.['minlength']) {
          <span class="msg-error">El nombre debe tener al menos 3 caracteres.</span>
        }
      </div>

      <!-- Botones -->
      <div class="acciones">
        <a routerLink="/generos" class="btn-cancelar">Cancelar</a>
        <button
          type="submit"
          class="btn-guardar"
          [disabled]="guardando"
        >
          {{ guardando ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>

    </form>
  </div>

</div>
